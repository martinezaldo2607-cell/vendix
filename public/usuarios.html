<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Vendix</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="usuarios" data-roles="ADMINISTRADOR">
  <aside id="barra-lateral" class="barra-lateral"></aside>
  <main class="contenido">
    <h2 class="titulo">Usuarios</h2>
    <div class="centrado"><button id="btn-nuevo" class="btn btn-primario" type="button">+ Agregar usuario</button></div>
    <div id="mensaje" class="mensaje" hidden></div>

    <div class="tabla-contenedor">
      <table>
        <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
    <p class="nota">El Administrador gestiona productos, inventario, reportes y usuarios. El Cajero registra ventas y consulta existencias, alertas e historial propio.</p>
  </main>

  <dialog id="dialogo">
    <form id="formulario">
      <h3 id="titulo-dialogo">Agregar usuario</h3>
      <label>Nombre completo
        <input type="text" name="nombre" maxlength="100" required>
      </label>
      <label>Usuario (para entrar)
        <input type="text" name="usuario" maxlength="50" autocomplete="off" required>
      </label>
      <label>Rol
        <select name="rol" required>
          <option value="CAJERO">Cajero</option>
          <option value="ADMINISTRADOR">Administrador</option>
        </select>
      </label>
      <label><span id="etq-password">Contraseña</span>
        <input type="password" name="password" maxlength="72" autocomplete="new-password">
      </label>
      <label class="interruptor">
        <input type="checkbox" name="activo" checked><span class="pista"></span><span>Cuenta activa</span>
      </label>
      <p id="ayuda-propia" class="nota-izq" hidden>Es tu propia cuenta: no puedes cambiar tu rol ni desactivarla.</p>
      <p id="error-form" class="error" hidden></p>
      <div class="botones">
        <button type="submit" class="btn btn-primario">Guardar</button>
        <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="js/comun.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
