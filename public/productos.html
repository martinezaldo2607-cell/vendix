<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Vendix</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="productos" data-roles="ADMINISTRADOR">
  <aside id="barra-lateral" class="barra-lateral"></aside>
  <main class="contenido">
    <h2 class="titulo">Productos</h2>
    <div class="centrado"><a href="producto-form.html" class="btn btn-primario">+ Agregar producto</a></div>

    <div class="filtros">
      <input type="search" id="buscar" placeholder="Buscar por nombre o código...">
      <label><input type="checkbox" id="solo-bajo"> Solo stock bajo</label>
      <label><input type="checkbox" id="ver-desactivados"> Mostrar desactivados</label>
    </div>

    <div id="mensaje" class="mensaje" hidden></div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Categoría</th><th id="th-base">Precio base</th>
            <th id="th-final">Precio final</th><th>Existencias</th><th></th>
          </tr>
        </thead>
        <tbody id="tabla-productos"></tbody>
      </table>
    </div>
  </main>

  <dialog id="dialogo">
    <h3 id="dialogo-titulo"></h3>
    <p id="dialogo-texto"></p>
    <div class="botones">
      <button id="dialogo-confirmar" class="btn btn-primario">Confirmar</button>
      <button id="dialogo-cancelar" class="btn btn-secundario">Cancelar</button>
    </div>
  </dialog>

  <script src="js/comun.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
